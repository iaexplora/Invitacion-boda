<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kevin y Lorena</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>

body{
margin:0;
background:#f7f2ed;
text-align:center;
font-family:'Segoe UI';
}

/* VIDEO INTRO */

#introVideo{

position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:999;

}

/* CONTENIDO OCULTO */

#contenido{

display:none;

}

/* PORTADA */

.hero{

height:100vh;
background:url("foto1.jpg") center/cover no-repeat;
display:flex;
justify-content:center;
align-items:center;

}

.hero h1{

font-family:'Great Vibes';
font-size:70px;
background:rgba(0,0,0,0.4);
padding:25px 50px;
border-radius:20px;
color:white;

}

/* CONTADOR */

.countdown{

display:flex;
justify-content:center;
gap:15px;
background:white;
padding:25px;
color:#5c3b2e;
font-weight:bold;

}

.box{

background:white;
padding:15px;
border-radius:10px;
box-shadow:0px 4px 10px rgba(0,0,0,0.2);

}

/* GALERIA */

.gallery{

overflow-x:auto;
display:flex;
gap:20px;
padding:40px;

}

.gallery img{

height:300px;
border-radius:20px;
box-shadow:0px 5px 20px rgba(0,0,0,0.2);

}

/* DETALLES */

.details{

color:#5c3b2e;
padding:30px;

}

/* BOTONES */

.btn{

display:inline-block;
margin:15px;
padding:15px 30px;
background:#d4af37;
color:white;
text-decoration:none;
border-radius:40px;

}

/* TEXTO BIBLICO */

.bible{

padding:40px;
font-style:italic;
font-size:22px;
color:#5c3b2e;

}

</style>

</head>

<body>

<!-- VIDEO INTRO -->

<video autoplay muted id="introVideo">

<source src="intro.mp4" type="video/mp4">

</video>


<!-- CONTENIDO INVITACION -->

<div id="contenido">

<audio id="musica" loop>

<source src="musica.mp3">

</audio>


<section class="hero">

<h1>

Kevin y Lorena

</h1>

</section>


<section class="countdown">

<div class="box">

<span id="dias"></span>
<br>Días

</div>

<div class="box">

<span id="horas"></span>
<br>Horas

</div>

<div class="box">

<span id="minutos"></span>
<br>Minutos

</div>

<div class="box">

<span id="segundos"></span>
<br>Segundos

</div>

</section>


<section class="gallery">

<img src="foto2.jpg">
<img src="foto3.jpg">
<img src="foto4.jpg">

</section>


<section class="details">

<h2>

¡Nos Casamos!

</h2>

<p>

📅 16 Mayo 2026

</p>

<p>

⏰ 5:00 PM

</p>

<p>

📍 Salón de Eventos

</p>


<a class="btn"
href="https://maps.google.com"
target="_blank">

Ver ubicación

</a>


<a class="btn"
href="https://wa.me/521XXXXXXXXXX">

Confirmar asistencia

</a>

</section>


<section class="bible">

“La cuerda triple no se rompe fácilmente.”
— Eclesiastés 4:12

</section>

</div>


<script>

/* TERMINA VIDEO Y ENTRA INVITACION */

var video=document.getElementById("introVideo");

video.onended=function(){

video.style.display="none";

document.getElementById("contenido").style.display="block";

document.getElementById("musica").play();

};


/* CONTADOR */

var fecha="May 16, 2026 17:00:00";

setInterval(function(){

var futuro=new Date(fecha).getTime();
var ahora=new Date().getTime();

var diferencia=futuro-ahora;

var dias=Math.floor(diferencia/(1000*60*60*24));
var horas=Math.floor((diferencia%(1000*60*60*24))/(1000*60*60));
var minutos=Math.floor((diferencia%(1000*60*60))/(1000*60));
var segundos=Math.floor((diferencia%(1000*60))/1000);

document.getElementById("dias").innerHTML=dias;
document.getElementById("horas").innerHTML=horas;
document.getElementById("minutos").innerHTML=minutos;
document.getElementById("segundos").innerHTML=segundos;

},1000);

</script>

</body>
</html>
