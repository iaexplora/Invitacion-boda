<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kevin & Lorena</title>

<link href="https://fonts.googleapis.com/css2?family=Italianno&family=Cormorant:wght@300&display=swap" rel="stylesheet">

<style>

:root{

--verde:#6f7f67;
--verdeClaro:#e7ebe4;
--texto:#3d4638;

}

body{

margin:0;
font-family:'Cormorant',serif;
background:#f5f5f2;
text-align:center;

}

/* SOBRE */

#sobre{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#f5f5f2;

}

.envelope{

width:320px;
height:200px;
background:var(--verde);
position:relative;
cursor:pointer;
border-radius:8px;
transition:1s;

}

.envelope:before{

content:"";
position:absolute;
top:-100px;
left:0;
border-left:160px solid transparent;
border-right:160px solid transparent;
border-bottom:100px solid var(--verde);

transition:1s;

}

.envelope.open{

transform:translateY(-200%);

}

/* CONTENIDO INVITACION */

#contenido{

display:none;

}

/* HERO */

.hero{

height:100vh;
display:flex;
justify-content:center;
align-items:center;

}

/* NOMBRES */

.nombres{

font-family:'Italianno',cursive;
font-size:120px;
color:var(--texto);
line-height:.8;

}

.y{

font-size:60px;

}

/* CONTADOR */

.countdown{

display:flex;
justify-content:center;
gap:20px;
padding:40px;

}

.box{

background:var(--verde);
color:white;
padding:20px;
border-radius:8px;
width:90px;

}

.numero{

font-size:32px;

}

/* BOTONES */

.btn{

display:inline-block;
margin:10px;
padding:15px 30px;
border-radius:40px;
background:var(--verde);
color:white;
text-decoration:none;

}

/* GALERIA */

.gallery{

display:flex;
overflow:auto;
gap:15px;
padding:40px;

}

.gallery img{

height:260px;
border-radius:12px;

}

</style>

</head>

<body>

<!-- SOBRE -->

<section id="sobre">

<div class="envelope" onclick="abrirInvitacion()"></div>

</section>

<!-- CONTENIDO -->

<section id="contenido">

<section class="hero">

<div>

<div class="nombres">

Kevin

<div class="y">

y

</div>

Lorena

</div>

</div>

</section>

<section class="countdown">

<div class="box">

<div id="dias" class="numero"></div>

Días

</div>

<div class="box">

<div id="horas" class="numero"></div>

Horas

</div>

<div class="box">

<div id="minutos" class="numero"></div>

Minutos

</div>

<div class="box">

<div id="segundos" class="numero"></div>

Segundos

</div>

</section>

<section>

<h2>

31 Mayo 2026 · 5:00 PM

</h2>

<br>

<a class="btn"

href="https://maps.google.com"

target="_blank">

Ubicación discurso

</a>

<a class="btn"

href="https://maps.google.com"

target="_blank">

Ubicación jardín

</a>

<br>

<a class="btn"

href="https://wa.me/521XXXXXXXXXX">

Confirmar asistencia

</a>

</section>

<section class="gallery">

<img src="foto2.jpg">

<img src="foto3.jpg">

<img src="foto4.jpg">

</section>

</section>

<script>

function abrirInvitacion(){

document.querySelector(".envelope").classList.add("open");

setTimeout(()=>{

document.getElementById("sobre").style.display="none";

document.getElementById("contenido").style.display="block";

},800);

}

/* CONTADOR */

var fecha="May 31, 2026 17:00:00";

setInterval(()=>{

var futuro=new Date(fecha).getTime();

var ahora=new Date().getTime();

var diferencia=futuro-ahora;

document.getElementById("dias").innerHTML=Math.floor(diferencia/(1000*60*60*24));

document.getElementById("horas").innerHTML=Math.floor((diferencia%(1000*60*60*24))/(1000*60*60));

document.getElementById("minutos").innerHTML=Math.floor((diferencia%(1000*60*60))/(1000*60));

document.getElementById("segundos").innerHTML=Math.floor((diferencia%(1000*60))/1000);

},1000);

</script>

</body>

</html>
