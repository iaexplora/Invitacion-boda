<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kevin & Lorena</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Cormorant Garamond',serif;
background:#f6f6f2;
color:#3f4a3c;
text-align:center;
}

/* SOBRE */

.sobre-container{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:#e7ebe4;

}

.sobre{

width:320px;
height:220px;
background:#7b8b6f;
position:relative;

border-radius:6px;

cursor:pointer;

}

/* tapa sobre */

.sobre::before{

content:"";

position:absolute;

top:0;

left:0;

width:0;
height:0;

border-left:160px solid transparent;
border-right:160px solid transparent;

border-top:110px solid #6a7a60;

transform-origin:top;

transition:.8s;

}

/* carta */

.carta{

position:absolute;

top:30px;

left:20px;

width:280px;

height:160px;

background:white;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

font-size:26px;

transition:.8s;

}

/* animación abrir */

.abierto::before{

transform:rotateX(180deg);

}

.abierto .carta{

transform:translateY(-120px);

}

/* NOMBRES */

.nombres{

font-family:'Great Vibes',cursive;

font-size:70px;

color:#5e6d57;

}

/* CONTADOR */

.countdown{

background:#7b8b6f;

color:white;

padding:40px;

display:flex;

justify-content:center;

gap:40px;

font-size:22px;

}

/* GALERIA */

.gallery{

padding:40px;

display:flex;

overflow-x:auto;

gap:20px;

background:white;

}

.gallery img{

height:280px;

border-radius:10px;

}

/* BOTONES */

.btn{

display:inline-block;

margin:10px;

padding:14px 30px;

border-radius:40px;

text-decoration:none;

background:#7b8b6f;

color:white;

transition:.3s;

}

.btn:hover{

background:#5e6d57;

}

/* TEXTO FINAL */

.final{

padding:40px;

font-style:italic;

}

</style>

</head>

<body>

<!-- SOBRE -->

<section class="sobre-container">

<div class="sobre" onclick="abrirSobre(this)">

<div class="carta">

<div class="nombres">

Kevin

<br>

&

<br>

Lorena

</div>

</div>

</div>

</section>

<!-- CONTADOR -->

<section class="countdown">

<div>

<div id="dias"></div>

Días

</div>

<div>

<div id="horas"></div>

Horas

</div>

<div>

<div id="minutos"></div>

Minutos

</div>

<div>

<div id="segundos"></div>

Segundos

</div>

</section>

<!-- GALERIA -->

<section class="gallery">

<img src="foto2.jpg">

<img src="foto3.jpg">

<img src="foto4.jpg">

</section>

<!-- UBICACIONES -->

<section>

<h2>

31 de mayo 2026 · 5:00 PM

</h2>

<a class="btn"

href="https://maps.app.goo.gl/pKYXwLpwqGsDyGT86"

target="_blank">

Ubicación discurso

</a>

<a class="btn"

href="https://maps.app.goo.gl/hUytKE2CfJkosyjRA"

target="_blank">

Ubicación jardín

</a>

</section>

<!-- TEXTO FINAL -->

<section class="final">

“La cuerda triple no se rompe fácilmente.”

— Eclesiastés 4:12

</section>

<script>

function abrirSobre(elemento){

elemento.classList.toggle("abierto");

}

document.getElementById("horas").innerHTML=Math.floor((diferencia%(1000*60*60*24))/(1000*60*60));

document.getElementById("minutos").innerHTML=Math.floor((diferencia%(1000*60*60))/(1000*60));

document.getElementById("segundos").innerHTML=Math.floor((diferencia%(1000*60))/1000);

</script>

</body>

</html>
