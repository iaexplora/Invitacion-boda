<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kevin y Lorena</title>

<style>

body{

margin:0;
font-family:serif;

}

/* VIDEO INTRO */

#introVideo{

position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:999;
transition:opacity 2s ease;

}

/* CONTENIDO INVITACION */

#contenido{

display:none;
opacity:0;
transition:opacity 2s ease;
text-align:center;

}

/* PORTADA */

.portada{

height:100vh;
background:url("foto1.jpg") center/cover no-repeat;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;

}

h1{

font-size:60px;
font-style:italic;

}

</style>

</head>

<body>

<!-- VIDEO INTRO -->

<video autoplay muted playsinline id="introVideo">

<source src="intro.mp4" type="video/mp4">

</video>

<!-- MUSICA -->

<audio id="musica" loop>

<source src="musica.mp3" type="audio/mp3">

</audio>

<!-- CONTENIDO -->

<div id="contenido">

<div class="portada">

<h1>Kevin y Lorena</h1>

<p>16 de mayo 2026</p>

</div>

</div>

<script>

var video=document.getElementById("introVideo");

video.onended=function(){

video.style.opacity="0";

setTimeout(function(){

video.style.display="none";

var contenido=document.getElementById("contenido");

contenido.style.display="block";

contenido.style.opacity="1";

document.getElementById("musica").play();

},2000);

};

</script>

</body>

</html>
