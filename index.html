<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kevin & Lorena</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
scroll-behavior:smooth;
}

body{
color:white;
text-align:center;
}

/* PORTADA */

.hero{
height:100vh;
background:url("foto1.jpg") center/cover no-repeat;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background-attachment:fixed;
}

.hero h1{
font-size:60px;
background:rgba(0,0,0,0.45);
padding:20px 40px;
border-radius:15px;
}

.scroll{
margin-top:40px;
font-size:20px;
animation:down 2s infinite;
}

@keyframes down{
0%{transform:translateY(0);}
50%{transform:translateY(15px);}
100%{transform:translateY(0);}
}

/* DETALLES */

.details{
height:100vh;
background:url("foto2.jpg") center/cover no-repeat;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

}

.card{
background:rgba(0,0,0,0.6);
padding:40px;
border-radius:25px;
max-width:400px;
}

.card h2{
font-size:35px;
margin-bottom:20px;
}

.card p{
font-size:22px;
margin:10px 0;
}

/* BOTONES */

.btn{
display:inline-block;
margin:15px;
padding:15px 30px;
background:#d4af37;
color:white;
text-decoration:none;
border-radius:40px;
font-weight:bold;
transition:.3s;
}

.btn:hover{
background:#b8962e;
}

/* CONTADOR */

.countdown{
font-size:26px;
margin-top:20px;
}

</style>
</head>

<body>

<section class="hero">
