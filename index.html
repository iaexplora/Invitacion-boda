<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kevin & Lorena</title>

<link href="https://fonts.googleapis.com/css2?family=Italianno&family=Cormorant+Garamond:wght@300&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Cormorant Garamond',serif;
background:#f5f5f0;
}

/* SOBRE PANTALLA INICIAL */

#pantallaSobre{

position:fixed;
width:100%;
height:100vh;

background:#e6eadf;

display:flex;

justify-content:center;
align-items:center;

z-index:9999;

transition:1.5s;

}

/* SOBRE REALISTA */

.sobre{

width:340px;
height:220px;

background:#7a876c;

position:relative;

cursor:pointer;

box-shadow:0 10px 25px rgba(0,0,0,.2);

}

/* tapa */

.tapa{

position:absolute;

width:100%;
height:100%;

background:#6a765e;

clip-path:polygon(0 0,50% 60%,100% 0);

transform-origin:top;

transition:1s;

}

/* carta interior */

.carta{

position:absolute;

width:85%;

height:75%;

background:white;

top:25px;

left:25px;

display:flex;

justify-content:center;

align-items:center;

font-family:'Italianno';

font-size:55px;

color:#7a876c;

transition:1s;

}

/* animacion abrir */

.abierto .tapa{

transform:rotateX(180deg);

}

.abierto .carta{

transform:translateY(-140px);

}

/* ocultar sobre */

.oculto{

opacity:0;

visibility:hidden;

}

/* HERO FOTO */

.hero{

height:100vh;

background:url("foto1.jpg") center/cover no-repeat;

display:flex;

justify-content:center;

align-items:center;

color:white;

}

/* nombres */

.nombres{

font-family:'Italianno';

font-size:110px;

text-shadow:0 3px 8px rgba(0,0,0,.4);

}

/* contador */

.countdown{

background:#7a876c;

color:white;

display:flex;

justify-content:center;

gap:40px;

padding:40px;

font-size:24px;

}

/* galeria */

.gallery{

display:flex;

overflow-x:auto;

gap:20px;

padding:40px;

background:white;

}

.gallery img{

height:300px;

border-radius:12px;

}

/* botones */

.btn{

display:inline-block;

margin:10px;

padding:14px 35px;

background:#7a876c;

color:white;

text-decoration:none;

border-radius:40px;

transition:.3s;

}

.btn:hover{

background:#5f6b53;

}

/* texto final */

.final{

padding:40px;

text-align:center;

font-style:italic;

}

</style>

</head>

<body>

<!-- SOBRE INICIAL -->

<section id="pantallaSobre">

<div class="sobre" onclick="abrirInvitacion()">

<div class="tapa"></div>

<div class="carta">

Kevin & Lorena

</div>

</div>

</section>

<!-- FOTO PRINCIPAL -->

<section class="hero">

<div class="nombres">

Kevin y Lorena

</div>

</section>

<!-- CONTADOR -->

<section class="countdown">

<div>

<div id="dias"></div>

Días

</div>

<div>

<div id="horas"></div>

Horas

</div>

<div>

<div id="minutos"></div>

Minutos

</div>

<div>

<div id="segundos"></div>

Segundos

</div>

</section>

<!-- GALERIA -->

<section class="gallery">

<img src="foto2.jpg">

<img src="foto3.jpg">

<img src="foto4.jpg">

</section>

<!-- UBICACION -->

<section style="text-align:center;padding:40px">

<h2>

31 Mayo 2026 · 5:00 PM

</h2>

<a class="btn"

href="https://maps.app.goo.gl/pKYXwLpwqGsDyGT86"

target="_blank">

Ubicación del discurso

</a>

<a class="btn"

href="https://maps.app.goo.gl/hUytKE2CfJkosyjRA"

target="_blank">

Ubicación jardín

</a>

<br>

<a class="btn"

href="https://wa.me/521XXXXXXXXXX">

Confirmar asistencia

</a>

</section>

<!-- TEXTO FINAL -->

<section class="final">

“La cuerda triple no se rompe fácilmente.”

— Eclesiastés 4:12

</section>

<script>

/* abrir sobre */

function abrirInvitacion(){

document.querySelector(".sobre").classList.add("abierto");

setTimeout(()=>{

document.getElementById("pantallaSobre").classList.add("oculto");

},1200);

}

/* contador */

var fecha="May 31, 2026 17:00:00";

setInterval(function(){

var futuro=new Date(fecha).getTime();

var ahora=new Date().getTime();

var diferencia=futuro-ahora;

document.getElementById("dias").innerHTML=Math.floor(diferencia/(1000*60*60*24));

document.getElementById("horas").innerHTML=Math.floor((diferencia%(1000*60*60*24))/(1000*60*60));

document.getElementById("minutos").innerHTML=Math.floor((diferencia%(1000*60*60))/(1000*60));

document.getElementById("segundos").innerHTML=Math.floor((diferencia%(1000*60))/1000);

},1000);

</script>

</body>

</html>
