<!DOCTYPE html>

<title>Kevin y Lorena</title>

<link href="https://fonts.googleapis.com/css2?family=Italianno&family=Cormorant:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

/* COLORES PRINCIPALES */

:root{

--verde:#6f7f67;

--verdeClaro:#e7ebe4;

--texto:#3d4638;

}

/* BODY */

body{

font-family:'Cormorant',serif;

background:#f4f4f1;

color:var(--texto);

text-align:center;

}

/* HERO */

.hero{

height:100vh;

background:url("foto1.jpg") center/cover no-repeat;

display:flex;

align-items:center;

justify-content:center;

}

/* TARJETA PRINCIPAL */

.card{

background:rgba(111,127,103,.85);

padding:60px 40px;

border-radius:10px;

color:white;

}

/* NOMBRES */

.nombres{

font-family:'Italianno',cursive;

font-size:110px;

line-height:.8;

}

/* LETRA Y */

.y{

font-size:55px;

margin:10px 0;

}

/* CONTADOR BLOQUE VERDE */

.countdown{

background:var(--verde);

color:white;

padding:60px 20px;

display:flex;

justify-content:center;

gap:40px;

font-size:22px;

}

/* NUMEROS CONTADOR */

.numero{

font-size:40px;

}

/* GALERIA */

.gallery{

background:white;

padding:60px 20px;

display:flex;

overflow-x:auto;

gap:20px;

}

.gallery img{

height:300px;

border-radius:12px;

}

/* INFO EVENTO */

.details{

background:var(--verde);

color:white;

padding:60px 20px;

}

/* BOTONES */

.btn{

display:inline-block;

margin:12px;

padding:15px 30px;

background:white;

color:var(--verde);

text-decoration:none;

border-radius:50px;

font-size:16px;

transition:.3s;

}

.btn:hover{

background:#f4f4f1;

}

/* TEXTO FINAL */

.bible{

padding:60px 20px;

font-style:italic;

font-size:22px;

}

</style>

</head>
