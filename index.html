<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kevin y Lorena</title>

<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f7f2ed;
text-align:center;
}

/* BOTON MUSICA */

.music-btn{
position:fixed;
bottom:20px;
right:20px;
background:#c9a54c;
border:none;
color:white;
padding:14px 22px;
border-radius:40px;
font-size:16px;
cursor:pointer;
box-shadow:0px 4px 12px rgba(0,0,0,0.15);
transition:.3s;
}

.music-btn:hover{
background:#b8963f;
}

/* PORTADA */

.hero{
height:100vh;
background:url("foto1.jpg") center/cover no-repeat;
display:flex;
justify-content:center;
align-items:center;
}

/* NOMBRES */

.nombres{

font-family:'Allura',cursive;

font-size:85px;

color:#f8f5ef;

background:rgba(0,0,0,0.18);

padding:30px 60px;

border-radius:25px;

display:flex;

flex-direction:column;

align-items:center;

line-height:1;

text-shadow:0px 1px 2px rgba(0,0,0,0.25);

}

/* LETRA Y */

.y{

font-family:'Allura',cursive;

font-size:40px;

margin:3px 0;

color:#f8f5ef;

}

/* CONTADOR */

.countdown{
display:flex;
justify-content:center;
gap:15px;
background:white;
padding:25px;
color:#5c3b2e;
font-weight:bold;
}

/* CAJAS CONTADOR */

.box{
background:white;
padding:15px;
border-radius:12px;
box-shadow:0px 4px 10px rgba(0,0,0,0.2);
}

/* GALERIA */

.gallery{
overflow-x:auto;
display:flex;
gap:20px;
padding:40px;
scroll-snap-type:x mandatory;
}

.gallery img{
height:300px;
border-radius:20px;
scroll-snap-align:center;
box-shadow:0px 5px 20px rgba(0,0,0,0.2);
}

/* DETALLES */

.details{
color:#5c3b2e;
padding:30px;
}

.details h2{
font-size:38px;
margin-bottom:20px;
}

/* BOTONES */

.btn{

display:inline-block;

margin:12px;

padding:14px 30px;

background:#c9a54c;

color:white;

text-decoration:none;

border-radius:40px;

font-weight:500;

letter-spacing:1px;

box-shadow:0px 4px 12px rgba(0,0,0,0.15);

transition:.3s;

}

.btn:hover{

background:#b8963f;

transform:scale(1.05);

}

/* TEXTO BIBLICO */

.bible{
padding:40px;
font-style:italic;
font-size:22px;
color:#5c3b2e;
}

</style>

</head>

<body>

<audio id="musica" loop>
<source src="musica.mp3" type="audio/mpeg">
</audio>

<button class="music-btn"
onclick="document.getElementById('musica').play()">
Activar música 🎵
</button>

<section class="hero">

<h1 class="nombres">

Kevin

<span class="y">

y

</span>

Lorena

</h1>

</section>

<section class="countdown">

<div class="box">
<span id="dias"></span>
<br>Días
</div>

<div class="box">
<span id="horas"></span>
<br>Horas
</div>

<div class="box">
<span id="minutos"></span>
<br>Minutos
</div>

<div class="box">
<span id="segundos"></span>
<br>Segundos
</div>

</section>

<section class="gallery">

<img src="foto2.jpg">
<img src="foto3.jpg">
<img src="foto4.jpg">

</section>

<section class="details">

<h2>
¡Nos Casamos!
</h2>

<p>
📅 31 Mayo 2026
</p>

<p>
⏰ 5:00 PM
</p>

<br>

<a class="btn"
href="https://maps.google.com"
target="_blank">

📍 Ubicación del discurso

</a>

<a class="btn"
href="https://maps.google.com"
target="_blank">

🌿 Ubicación jardín de eventos

</a>

<br>

<a class="btn"
href="https://wa.me/521XXXXXXXXXX">

Confirmar asistencia

</a>

</section>

<section class="bible">

“La cuerda triple no se rompe fácilmente.”
— Eclesiastés 4:12 (Traducción del Nuevo Mundo)

</section>

<script>

var fecha="May 31, 2026 17:00:00";

setInterval(function(){

var futuro=new Date(fecha).getTime();
var ahora=new Date().getTime();

var diferencia=futuro-ahora;

var dias=Math.floor(diferencia/(1000*60*60*24));
var horas=Math.floor((diferencia%(1000*60*60*24))/(1000*60*60));
var minutos=Math.floor((diferencia%(1000*60*60))/(1000*60));
var segundos=Math.floor((diferencia%(1000*60))/1000);

document.getElementById("dias").innerHTML=dias;
document.getElementById("horas").innerHTML=horas;
document.getElementById("minutos").innerHTML=minutos;
document.getElementById("segundos").innerHTML=segundos;

},1000);

</script>

</body>
</html>
