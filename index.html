<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kevin & Lorena</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f7f2ed;
text-align:center;
}

/* PORTADA */

.hero{

height:100vh;

background:url("foto1.jpg") center center no-repeat;

background-size:cover;

display:flex;

justify-content:center;

align-items:center;

}

.hero h1{

font-size:45px;

background:rgba(0,0,0,.4);

color:white;

padding:15px 25px;

border-radius:12px;

}

/* CONTADOR */

.countdown{

display:flex;

flex-wrap:wrap;

justify-content:center;

gap:10px;

padding:20px;

}

.box{

background:white;

padding:15px;

width:80px;

border-radius:12px;

box-shadow:0px 3px 10px rgba(0,0,0,.2);

color:#5c3b2e;

font-size:18px;

}

/* FOTO 2 */

.section-photo{

padding:20px;

}

.photo-card{

background:white;

padding:12px;

border-radius:15px;

box-shadow:0px 3px 10px rgba(0,0,0,.2);

max-width:320px;

margin:auto;

}

.photo-card img{

width:100%;

border-radius:12px;

}

/* INFO EVENTO */

.details{

padding:25px;

color:#5c3b2e;

}

.details h2{

font-size:32px;

margin-bottom:10px;

}

.details p{

font-size:20px;

margin:8px;

}

/* BOTONES */

.btn{

display:inline-block;

margin:10px;

padding:14px 25px;

background:#d4af37;

color:white;

text-decoration:none;

border-radius:40px;

font-weight:bold;

}

/* BOTON MUSICA */

.music-btn{

position:fixed;

bottom:20px;

right:20px;

background:#d4af37;

color:white;

padding:12px 18px;

border-radius:40px;

font-size:18px;

}

</style>

</head>

<body>


<!-- MUSICA (botón obligatorio en celular) -->

<audio id="musica" loop>

<source src="musica.mp3" type="audio/mpeg">

</audio>

<button class="music-btn" onclick="document.getElementById('musica').play()">

🎵 Música

</button>


<!-- PORTADA -->

<section class="hero">

<h1>

Kevin & Lorena 💍

</h1>

</section>


<!-- CONTADOR -->

<section class="countdown">

<div class="box">

<span id="dias"></span>

<br>Días

</div>

<div class="box">

<span id="horas"></span>

<br>Horas

</div>

<div class="box">

<span id="minutos"></span>

<br>Minutos

</div>

<div class="box">

<span id="segundos"></span>

<br>Segundos

</div>

</section>


<!-- FOTO -->

<section class="section-photo">

<div class="photo-card">

<img src="foto2.jpg">

</div>

</section>


<!-- DETALLES -->

<section class="details">

<h2>

¡Nos Casamos!

</h2>

<p>

📅 16 Mayo 2026

</p>

<p>

⏰ 5:00 PM

</p>

<p>

📍 Salón de Eventos

</p>

<a class="btn"

href="https://maps.google.com"

target="_blank">

Ver ubicación 📍

</a>

<a class="btn"

href="https://wa.me/521XXXXXXXXXX">

Confirmar asistencia 💬

</a>

</section>


<script>

var fecha="May 16, 2026 17:00:00";

setInterval(function(){

var futuro=new Date(fecha).getTime();

var ahora=new Date().getTime();

var diferencia=futuro-ahora;

var dias=Math.floor(diferencia/(1000*60*60*24));

var horas=Math.floor((diferencia%(1000*60*60*24))/(1000*60*60));

var minutos=Math.floor((diferencia%(1000*60*60))/(1000*60));

var segundos=Math.floor((diferencia%(1000*60))/1000);

document.getElementById("dias").innerHTML=dias;

document.getElementById("horas").innerHTML=horas;

document.getElementById("minutos").innerHTML=minutos;

document.getElementById("segundos").innerHTML=segundos;

},1000);

</script>


</body>

</html>
