<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kevin & Lorena</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
scroll-behavior:smooth;
}

body{
color:white;
text-align:center;
background:#f7f2ed;
}

/* PORTADA */

.hero{
height:100vh;
background:url("foto1.jpg") center/cover no-repeat;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.hero h1{
font-size:60px;
background:rgba(0,0,0,0.4);
padding:20px 40px;
border-radius:15px;
}

/* CONTADOR */

.countdown{
display:flex;
justify-content:center;
gap:20px;
background:#fff;
color:#5c3b2e;
padding:25px;
font-size:22px;
font-weight:bold;
}

.box{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0px 4px 10px rgba(0,0,0,0.2);
}

/* FOTO PEQUEÑA */

.section-photo{

display:flex;
justify-content:center;
padding:40px;
}

.photo-card{

background:white;
padding:15px;
border-radius:20px;
box-shadow:0px 5px 20px rgba(0,0,0,0.2);
width:80%;

}

.photo-card img{

width:100%;
border-radius:15px;

}

/* INFO EVENTO */

.details{

color:#5c3b2e;
padding:40px;

}

.details h2{

font-size:40px;
margin-bottom:20px;

}

.details p{

font-size:22px;
margin:10px;

}

/* BOTONES */

.btn{

display:inline-block;
margin:15px;
padding:15px 30px;
background:#d4af37;
color:white;
text-decoration:none;
border-radius:40px;
font-weight:bold;

}

</style>

</head>

<body>

<!-- MUSICA -->

<audio autoplay loop>
<source src="musica.mp3" type="audio/mpeg">
</audio>

<!-- PORTADA -->

<section class="hero">

<h1>
Kevin & Lorena 💍
</h1>

</section>

<!-- CONTADOR -->

<section class="countdown">

<div class="box">
<span id="dias"></span>
<br>Días
</div>

<div class="box">
<span id="horas"></span>
<br>Horas
</div>

<div class="box">
<span id="minutos"></span>
<br>Minutos
</div>

<div class="box">
<span id="segundos"></span>
<br>Segundos
</div>

</section>

<!-- FOTO PEQUEÑA -->

<section class="section-photo">

<div class="photo-card">

<img src="foto2.jpg">

</div>

</section>

<!-- DETALLES EVENTO -->

<section class="details">

<h2>
¡Nos Casamos!
</h2>

<p>
📅 16 Mayo 2026
</p>

<p>
⏰ 5:00 PM
</p>

<p>
📍 Salón de Eventos
</p>

<a class="btn"
href="https://maps.google.com"
target="_blank">

Ver ubicación 📍

</a>

<a class="btn"
href="https://wa.me/521XXXXXXXXXX">

Confirmar asistencia 💬

</a>

</section>

<script>

var fecha="May 16, 2026 17:00:00";

setInterval(function(){

var futuro=new Date(fecha).getTime();

var ahora=new Date().getTime();

var diferencia=futuro-ahora;

var dias=Math.floor(diferencia/(1000*60*60*24));

var horas=Math.floor((diferencia%(1000*60*60*24))/(1000*60*60));

var minutos=Math.floor((diferencia%(1000*60*60))/(1000*60));

var segundos=Math.floor((diferencia%(1000*60))/1000);

document.getElementById("dias").innerHTML=dias;

document.getElementById("horas").innerHTML=horas;

document.getElementById("minutos").innerHTML=minutos;

document.getElementById("segundos").innerHTML=segundos;

},1000);

</script>

</body>
</html>
