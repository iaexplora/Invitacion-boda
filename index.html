<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kevin y Lorena</title>

<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
background:#f6f5f2;
text-align:center;
font-family:'Cormorant',serif;
color:#4b5a46;
}

/* BOTON MUSICA */

.music-btn{

position:fixed;

bottom:20px;

right:20px;

background:transparent;

border:1px solid #6b7a63;

color:#6b7a63;

padding:12px 22px;

border-radius:40px;

font-size:15px;

cursor:pointer;

transition:.3s;

}

.music-btn:hover{

background:#6b7a63;

color:white;

}

/* PORTADA */

.hero{

height:100vh;

background:url("foto1.jpg") center/cover no-repeat;

display:flex;

justify-content:center;

align-items:center;

}

/* NOMBRES PRINCIPALES */

.nombres{

font-family:'Allura',cursive;

font-size:72px;

color:#f4f4f1;

background:rgba(70,80,65,0.35);

padding:35px 70px;

border-radius:18px;

display:flex;

flex-direction:column;

align-items:center;

line-height:1;

letter-spacing:1px;

}

/* LETRA Y */

.y{

font-family:'Allura',cursive;

font-size:36px;

margin:2px 0;

}

/* CONTADOR */

.countdown{

display:flex;

justify-content:center;

gap:18px;

background:#ffffff;

padding:30px;

}

/* CAJAS CONTADOR */

.box{

background:#f6f5f2;

padding:18px;

border-radius:12px;

border:1px solid #dde2d8;

font-weight:300;

}

/* GALERIA */

.gallery{

overflow-x:auto;

display:flex;

gap:20px;

padding:45px;

scroll-snap-type:x mandatory;

}

.gallery img{

height:300px;

border-radius:16px;

scroll-snap-align:center;

box-shadow:0px 6px 20px rgba(0,0,0,0.08);

}

/* DETALLES */

.details{

padding:40px;

}

.details h2{

font-size:36px;

font-weight:300;

margin-bottom:20px;

}

/* BOTONES ELEGANTES */

.btn{

display:inline-block;

margin:10px;

padding:14px 28px;

background:transparent;

border:1px solid #6b7a63;

color:#6b7a63;

text-decoration:none;

border-radius:40px;

font-size:15px;

letter-spacing:1px;

transition:.3s;

}

.btn:hover{

background:#6b7a63;

color:white;

}

/* TEXTO BIBLICO */

.bible{

padding:50px;

font-style:italic;

font-size:22px;

color:#6b7a63;

}

</style>

</head>

<body>

<audio id="musica" loop>

<source src="musica.mp3" type="audio/mpeg">

</audio>

<button class="music-btn"

onclick="document.getElementById('musica').play()">

Activar música

</button>

<section class="hero">

<h1 class="nombres">

Kevin

<span class="y">

y

</span>

Lorena

</h1>

</section>

<section class="countdown">

<div class="box">

<span id="dias"></span>

<br>Días

</div>

<div class="box">

<span id="horas"></span>

<br>Horas

</div>

<div class="box">

<span id="minutos"></span>

<br>Minutos

</div>

<div class="box">

<span id="segundos"></span>

<br>Segundos

</div>

</section>

<section class="gallery">

<img src="foto2.jpg">

<img src="foto3.jpg">

<img src="foto4.jpg">

</section>

<section class="details">

<h2>

Nuestra Boda

</h2>

<p>

31 Mayo 2026 · 5:00 PM

</p>

<br>

<a class="btn"

href="https://maps.google.com"

target="_blank">

Ubicación del discurso

</a>

<a class="btn"

href="https://maps.google.com"

target="_blank">

Ubicación jardín de eventos

</a>

<br>

<a class="btn"

href="https://wa.me/521XXXXXXXXXX">

Confirmar asistencia

</a>

</section>

<section class="bible">

“La cuerda triple no se rompe fácilmente.”
— Eclesiastés 4:12

</section>

<script>

var fecha="May 31, 2026 17:00:00";

setInterval(function(){

var futuro=new Date(fecha).getTime();

var ahora=new Date().getTime();

var diferencia=futuro-ahora;

var dias=Math.floor(diferencia/(1000*60*60*24));

var horas=Math.floor((diferencia%(1000*60*60*24))/(1000*60*60));

var minutos=Math.floor((diferencia%(1000*60*60))/(1000*60));

var segundos=Math.floor((diferencia%(1000*60))/1000);

document.getElementById("dias").innerHTML=dias;

document.getElementById("horas").innerHTML=horas;

document.getElementById("minutos").innerHTML=minutos;

document.getElementById("segundos").innerHTML=segundos;

},1000);

</script>

</body>
</html>
