<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kevin & Lorena</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300&display=swap" rel="stylesheet">

<style>

body{

margin:0;

font-family:'Cormorant Garamond',serif;

background:#f4f4f0;

text-align:center;

}

/* SOBRE PANTALLA INICIAL */

#pantallaSobre{

position:fixed;

width:100%;

height:100vh;

background:#e7eadf;

display:flex;

justify-content:center;

align-items:center;

z-index:9999;

transition:1.5s;

}

/* SOBRE */

.sobre{

width:340px;

height:220px;

background:#7c886d;

border-radius:6px;

position:relative;

cursor:pointer;

box-shadow:0 18px 40px rgba(0,0,0,.25);

}

/* TAPA SOBRE */

.tapa{

position:absolute;

top:0;

width:100%;

height:100%;

background:#6e7a60;

clip-path:polygon(0 0,50% 60%,100% 0);

transition:1s;

transform-origin:top;

}

/* SELLO */

.sello{

position:absolute;

width:70px;

height:70px;

background:#c9a35a;

border-radius:50%;

top:75px;

left:135px;

display:flex;

align-items:center;

justify-content:center;

font-family:'Great Vibes';

font-size:28px;

color:white;

box-shadow:0 5px 15px rgba(0,0,0,.3);

}

/* abrir animación */

.abierto .tapa{

transform:rotateX(180deg);

}

/* ocultar pantalla */

.oculto{

opacity:0;

visibility:hidden;

}

/* FOTO PRINCIPAL */

.hero{

height:100vh;

background:url("foto1.jpg") center/cover no-repeat;

display:flex;

align-items:center;

justify-content:center;

}

/* NOMBRES */

.nombres{

font-family:'Great Vibes';

font-size:120px;

color:white;

text-align:center;

line-height:1;

text-shadow:0 4px 10px rgba(0,0,0,.5);

}

/* CONTADOR */

.countdown{

background:#7c886d;

color:white;

display:flex;

justify-content:center;

gap:40px;

padding:40px;

font-size:22px;

}

/* GALERIA */

.gallery{

display:flex;

overflow-x:auto;

gap:20px;

padding:40px;

background:white;

}

.gallery img{

height:280px;

border-radius:12px;

}

/* BOTONES */

.btn{

display:inline-block;

margin:12px;

padding:15px 38px;

background:#7c886d;

color:white;

border-radius:40px;

text-decoration:none;

font-size:18px;

text-align:center;

min-width:240px;

}

/* TEXTO FINAL */

.final{

padding:40px;

font-style:italic;

}

</style>

</head>

<body>

<!-- SOBRE -->

<section id="pantallaSobre">

<div class="sobre" onclick="abrirInvitacion()">

<div class="tapa"></div>

<div class="sello">

K&L

</div>

</div>

</section>

<!-- FOTO PRINCIPAL -->

<section class="hero">

<div class="nombres">

Kevin<br>

Y<br>

Lorena

</div>

</section>

<!-- CONTADOR -->

<section class="countdown">

<div>

<div id="dias"></div>

Días

</div>

<div>

<div id="horas"></div>

Horas

</div>

<div>

<div id="minutos"></div>

Minutos

</div>

<div>

<div id="segundos"></div>

Segundos

</div>

</section>

<!-- GALERIA -->

<section class="gallery">

<img src="foto2.jpg">

<img src="foto3.jpg">

<img src="foto4.jpg">

</section>

<!-- UBICACION -->

<section style="padding:40px">

<h2>

31 Mayo 2026 · 5:00 PM

</h2>

<br>

<a class="btn"

href="https://maps.app.goo.gl/pKYXwLpwqGsDyGT86"

target="_blank">

Ubicación del discurso

</a>

<br>

<a class="btn"

href="https://maps.app.goo.gl/hUytKE2CfJkosyjRA"

target="_blank">

Ubicación jardín

</a>

<br>

<a class="btn"

href="https://wa.me/521XXXXXXXXXX">

Confirmar asistencia

</a>

</section>

<!-- TEXTO FINAL -->

<section class="final">

“La cuerda triple no se rompe fácilmente.”

— Eclesiastés 4:12

</section>

<script>

function abrirInvitacion(){

document.querySelector(".sobre").classList.add("abierto");

setTimeout(()=>{

document.getElementById("pantallaSobre").classList.add("oculto");

},1000);

}

/* contador */

var fecha="May 31, 2026 17:00:00";

setInterval(function(){

var futuro=new Date(fecha).getTime();

var ahora=new Date().getTime();

var diferencia=futuro-ahora;

document.getElementById("dias").innerHTML=Math.floor(diferencia/(1000*60*60*24));

document.getElementById("horas").innerHTML=Math.floor((diferencia%(1000*60*60*24))/(1000*60*60));

document.getElementById("minutos").innerHTML=Math.floor((diferencia%(1000*60*60))/(1000*60));

document.getElementById("segundos").innerHTML=Math.floor((diferencia%(1000*60))/1000);

},1000);

</script>

</body>

</html>
